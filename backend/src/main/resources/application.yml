spring:
  application:
    name: pios-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pios}
    username: ${SPRING_DATASOURCE_USERNAME:pios}
    password: ${SPRING_DATASOURCE_PASSWORD:pios123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

# 스케줄(@Scheduled) 및 일 단위 집계 기준 타임존
app:
  timezone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:pios-jwt-secret-key-2026-change-in-production}
  expiration: 86400000

neo4j:
  uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
  username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
  password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:pios1234}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

garmin:
  python:
    script-path: scripts/garmin_sync.py
    timeout-seconds: 120

sync:
  rate-limit-seconds: 30
  chunk-days: 30
  default-full-sync-months: 12
  schedule:
    # 전날 수면이 Garmin에 반영될 시간을 두고 KST 정오에 동기화
    cron: "0 0 12 * * *"

briefing:
  schedule:
    # 일요일 동기화(12:00) 이후 주간 브리핑
    cron: "0 0 13 * * SUN"

logging:
  level:
    com.pios: INFO
    org.springframework.security: INFO
