services:
  postgres:
    # PostgreSQL 15.4 + pgvector 0.5.1 (운영 중인 이미지 digest로 고정. 메이저 업그레이드는 dump/restore 필요)
    image: ankane/pgvector@sha256:956744bd14e9cbdf639c61c2a2a7c7c2c48a9c8cdd42f7de4ac034f4e96b90f8
    container_name: pios-postgres
    environment:
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pios123}
      POSTGRES_DB: pios
    # 호스트 로컬에서만 접근 (외부 노출 금지)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pios-backend
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pios
      SPRING_DATASOURCE_USERNAME: pios
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pios123}
      SPRING_NEO4J_URI: ${NEO4J_URI:-}
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USERNAME:-}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PIOS_ENCRYPTION_KEY: ${PIOS_ENCRYPTION_KEY:?PIOS_ENCRYPTION_KEY must be set in .env}
      PIOS_ENCRYPTION_KEY_LEGACY: ${PIOS_ENCRYPTION_KEY_LEGACY:-}
      PIOS_REGISTRATION_ENABLED: ${PIOS_REGISTRATION_ENABLED:-false}
      PIOS_MOCK_DATA_ENABLED: ${PIOS_MOCK_DATA_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - garmin_tokens:/app/data/garmin-tokens
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pios-network
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: pios-mcp
    environment:
      PIOS_API_URL: http://backend:8080/api
      PIOS_API_KEY: ${PIOS_MCP_API_KEY:-}
    # 외부 접근은 Caddy(/mcp)를 통해서만
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - backend
    networks:
      - pios-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pios-frontend
    depends_on:
      - backend
    networks:
      - pios-network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pios-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - pios-network
    restart: unless-stopped

volumes:
  postgres_data:
  garmin_tokens:
  caddy_data:
  caddy_config:

networks:
  pios-network:
    driver: bridge
