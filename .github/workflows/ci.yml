name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type check & build
        run: npm run build
      - name: Audit (critical only blocks)
        run: npm audit --audit-level=critical

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp/requirements.txt
      - name: Install
        run: pip install -r mcp/requirements-dev.txt
      - name: Test
        run: pytest mcp/tests

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python scripts
        run: python -m py_compile backend/scripts/garmin_sync.py mcp/server.py mcp/pios_mcp/*.py
      - name: Shell syntax (ops scripts)
        run: for f in scripts/ops/*.sh; do bash -n "$f"; done

  compose:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: dummy
      PIOS_ENCRYPTION_KEY: dummy
      PIOS_MCP_INTERNAL_SECRET: dummy-dummy-dummy-dummy-dummy-dummy-dummy
      POSTGRES_PASSWORD: dummy
      PIOS_PUBLIC_BASE_URL: https://example.test
      PIOS_CORS_ALLOWED_ORIGINS: https://example.test
      NEO4J_URI: bolt://neo4j.example.test:7687
      NEO4J_PASSWORD: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config -q
      - name: Validate Caddyfile
        run: >
          docker run --rm -e PIOS_DOMAIN=example.test
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
